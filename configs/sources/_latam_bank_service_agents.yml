- source_table: service_agents
  sor: latam_bank
  description: "LATAM Bank customer service representatives and branch staff"

  # --- S3 copy (option 2) ---
  s3_copy:
    bucket: factored-datathon-2026-s3-157725502942-us-east-2-an
    region: us-east-2
    prefix: data/
    file_name_pattern: "service_agents.csv"
    secret_scope: aws-datathon
    access_key_secret: aws-access-key-id
    secret_key_secret: aws-secret-access-key
    volume: workspace.staging_latam_bank.landing

  # --- Auto Loader ---
  source_path: /Volumes/workspace/staging_latam_bank/landing/service_agents/
  file_format: csv
  bronze_options:
    include_existing_files: true
    file_name_pattern: "service_agents.csv"
    schema_evolution_mode: addNewColumns
    csv_options:
      header: true
      delimiter: ","

  # --- Layers ---
  staging_schema: staging_latam_bank
  source_schema: bronze_latam_bank
  target_schema: silver_latam_bank

  # --- Silver (SCD Type 2) ---
  scd_2_key_list:
    - agent_id
  history_timestamp_source: pipeline_timestamp
  scd_type: 2
  data_quality_rules:
    - description: agent_id_not_null
      expr: "`agent_id` IS NOT NULL"
