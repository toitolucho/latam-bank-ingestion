- source_table: daily_exchange_rates
  sor: latam_bank
  description: "Daily foreign currency exchange rates for LATAM Bank transactions"

  # --- S3 copy (option 2) ---
  s3_copy:
    bucket: factored-datathon-2026-s3-157725502942-us-east-2-an
    region: us-east-2
    prefix: data/
    file_name_pattern: "daily_exchange_rates.csv"
    secret_scope: aws-datathon
    access_key_secret: aws-access-key-id
    secret_key_secret: aws-secret-access-key
    volume: workspace.staging_latam_bank.landing

  # --- Auto Loader ---
  source_path: /Volumes/workspace/staging_latam_bank/landing/daily_exchange_rates/
  file_format: csv
  bronze_options:
    include_existing_files: true
    file_name_pattern: "daily_exchange_rates.csv"
    schema_evolution_mode: addNewColumns
    csv_options:
      header: true
      delimiter: ","

  # --- Layers ---
  staging_schema: staging_latam_bank
  source_schema: bronze_latam_bank
  target_schema: silver_latam_bank

  # --- Silver (SCD Type 2) ---
  scd_2_key_list:
    - date
    - source_currency
    - target_currency
  history_timestamp_source: date
  history_timestamp_format: "yyyy-MM-dd"
  scd_type: 2
  data_quality_rules:
    - description: exchange_keys_not_null
      expr: "`date` IS NOT NULL AND `source_currency` IS NOT NULL AND `target_currency` IS NOT NULL"
