- source_table: transactions
  sor: latam_bank
  description: "LATAM Bank transactional records across deposits, withdrawals, transfers, and card payments"

  # --- S3 copy (option 2) ---
  s3_copy:
    bucket: factored-datathon-2026-s3-157725502942-us-east-2-an
    region: us-east-2
    prefix: data/transactions/
    file_name_pattern: "*.csv"
    secret_scope: aws-datathon
    access_key_secret: aws-access-key-id
    secret_key_secret: aws-secret-access-key
    volume: workspace.staging_latam_bank.landing

  # --- Auto Loader ---
  source_path: /Volumes/workspace/staging_latam_bank/landing/transactions/
  file_format: csv
  bronze_options:
    include_existing_files: true
    file_name_pattern: "*.csv"
    schema_evolution_mode: addNewColumns
    csv_options:
      header: true
      delimiter: ","

  # --- Layers ---
  staging_schema: staging_latam_bank
  source_schema: bronze_latam_bank
  target_schema: silver_latam_bank

  # --- Silver (SCD Type 2) ---
  scd_2_key_list:
    - transaction_id
  history_timestamp_source: transaction_date
  history_timestamp_format: "yyyy-MM-dd HH:mm:ss"
  scd_type: 2
  data_quality_rules:
    - description: transaction_id_not_null
      expr: "`transaction_id` IS NOT NULL"
