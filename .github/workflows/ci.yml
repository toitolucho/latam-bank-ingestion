name: CI

# Cada trabajo se activa solo si existe lo que revisa, para que el repositorio esté en verde
# desde el primer commit y a medida que llegan los pull requests.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pruebas con el conjunto de ejemplo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "present=$([ -f backend/requirements-dev.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - if: steps.has.outputs.present == 'true'
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: "Pruebas (sin red, con LLM falso o reglas, sin datos del organizador)"
        if: steps.has.outputs.present == 'true'
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (sintaxis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "present=$([ -f frontend/app.js ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.has.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - if: steps.has.outputs.present == 'true'
        run: node --check frontend/app.js && node --check frontend/i18n.js && node --check frontend/config.js

  docker:
    name: Imagenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          if [ -f docker-compose.yml ] && [ -f backend/Dockerfile ] && [ -f frontend/Dockerfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Construir backend y frontend
        if: steps.has.outputs.present == 'true'
        run: docker compose build
      - name: Levantar y comprobar salud
        if: steps.has.outputs.present == 'true'
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break || sleep 3
          done
          curl -sf http://localhost:8080/v1/meta
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/handoffs)" = "404"
      - if: always() && steps.has.outputs.present == 'true'
        run: docker compose down

  secrets:
    name: Barrido de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar claves conocidas en el repositorio
        run: |
          if grep -rIn --exclude-dir=.git -E 'AKIA[0-9A-Z]{16}|sk-ant-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' . ; then
            echo "Se encontraron posibles secretos"; exit 1
          fi
